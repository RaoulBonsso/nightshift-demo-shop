<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brûlerie Démo</title>
<style>
body{font-family:system-ui,sans-serif;background:#faf7f2;color:#2b2118;margin:0;padding:32px 16px}
.wrap{max-width:560px;margin:auto}
h1{margin:0 0 4px}.sub{color:#7a6a5a;margin:0 0 24px}
.row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #eadfd2;border-radius:10px;padding:12px 16px;margin-bottom:8px}
input[type=number]{width:56px;padding:6px}
.coupon{display:flex;gap:8px;margin:16px 0}.coupon input{flex:1;padding:10px;border:1px solid #d9c9b6;border-radius:8px}
button{background:#6b3e1f;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:600;cursor:pointer;width:100%}
#out{margin-top:16px;padding:14px;border-radius:10px;background:#fff;border:1px solid #eadfd2;white-space:pre-line}
.err{border-color:#e0a0a0!important;background:#fff3f3!important;color:#8a1f1f}
</style></head><body><div class="wrap">
<h1>☕ Brûlerie Démo</h1><p class="sub">Boutique e-commerce de démonstration</p>
<div id="list"></div>
<div class="coupon"><input id="coupon" placeholder="Code promo (ex : BIENVENUE10)"></div>
<button onclick="pay()">Valider la commande</button>
<div id="out" hidden></div>
</div><script>
const P={"cafe-bio":["Café bio 1kg",18.9],"mug":["Mug céramique",12.5],"moulin":["Moulin manuel",49],"the-vert":["Thé vert Sencha 🆕",9.9]};
list.innerHTML=Object.entries(P).map(([id,[n,p]])=>`<div class="row"><span>${n} — <b>${p.toFixed(2)} €</b></span><input type="number" min="0" value="${id==='cafe-bio'?2:0}" data-id="${id}"></div>`).join("");
async function pay(){
  const items=[...document.querySelectorAll("[data-id]")].map(i=>({id:i.dataset.id,qty:+i.value})).filter(i=>i.qty>0);
  const r=await fetch("/api/checkout",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({items,coupon:coupon.value.trim()||undefined})});
  const d=await r.json();out.hidden=false;
  if(!r.ok){out.className="err";out.textContent="❌ "+d.error;return}
  out.className="";out.textContent=`Sous-total : ${d.subtotal.toFixed(2)} €\nRemise : -${d.discount.toFixed(2)} €\nLivraison : ${d.shipping.toFixed(2)} €\nTotal : ${d.total.toFixed(2)} € ✅`;
}
</script></body></html>
